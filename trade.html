<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade - Clutch Incorporated</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Content -->
    <main>
        <section class="section">
            <div class="content">
                <h1>Trade</h1>
                <p>Explore trading opportunities and markets</p>
                
                <!-- Deposit and Withdrawal Buttons -->
                <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
                    <a href="chat.html?action=deposit" class="action-btn" style="flex: 1; min-width: 150px; text-decoration: none;">
                        <i class="fas fa-arrow-down"></i>
                        <span>Deposit</span>
                    </a>
                    <a href="chat.html?action=withdrawal" class="action-btn" style="flex: 1; min-width: 150px; text-decoration: none;">
                        <i class="fas fa-arrow-up"></i>
                        <span>Withdrawal</span>
                    </a>
                </div>
                
                <p style="margin-top: 1.5rem; color: #64748b; font-size: 0.9rem;">
                    <i class="fas fa-info-circle"></i> For security reasons, all deposits and withdrawals are processed through customer service. Click above to start the process.
                </p>
            </div>
        </section>
    </main>

    <!-- Liquid Navigation at Bottom -->
    <nav class="liquid-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li>
                    <a href="home.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="tasks.html" class="nav-link">
                        <i class="fas fa-tasks"></i>
                        <span>Tasks</span>
                    </a>
                </li>
                <li>
                    <a href="trade.html" class="nav-link active">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Trade</span>
                    </a>
                </li>
                <li>
                    <a href="chat.html" class="nav-link">
                        <i class="fas fa-comments"></i>
                        <span>Chat</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <script src="script.js"></script>
    <script src="auth-check.js"></script>
</body>
</html>
