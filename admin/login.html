<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Clutch Incorporated</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Content -->
    <main>
        <section class="section">
            <div class="auth-container">
                <!-- Logo Placeholder -->
                <div class="logo-placeholder">
                    <i class="fas fa-cube"></i>
                    <h2>Clutch Admin Panel</h2>
                </div>

                <!-- Admin Login Form -->
                <form class="auth-form active" id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminUsername">Admin Username</label>
                        <input type="text" id="adminUsername" placeholder="Enter admin username" required>
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <div class="password-input">
                            <input type="password" id="adminPassword" placeholder="Enter password" required>
                            <button type="button" class="toggle-password" data-target="adminPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Admin Login</button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="../auth.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Back to User Login
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
