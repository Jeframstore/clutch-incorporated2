<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View User - Admin Panel</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-logo">
            <i class="fas fa-cube"></i>
            <h2>Clutch Admin</h2>
        </div>
        <div class="admin-user">
            <span id="adminUserName">Admin</span>
            <button class="admin-logout-btn" id="adminLogoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </header>

    <!-- Horizontal Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <a href="dashboard.html" class="admin-nav-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-link active">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="tasks.html" class="admin-nav-link">
                <i class="fas fa-tasks"></i>
                <span>Tasks</span>
            </a>
            <a href="tutors.html" class="admin-nav-link">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>Tutors</span>
            </a>
            <a href="customer-service.html" class="admin-nav-link">
                <i class="fas fa-headset"></i>
                <span>Customer Service</span>
            </a>
            <a href="admins.html" class="admin-nav-link">
                <i class="fas fa-user-shield"></i>
                <span>Admins</span>
            </a>
            <a href="finance.html" class="admin-nav-link">
                <i class="fas fa-wallet"></i>
                <span>Finance</span>
            </a>
            <a href="settings.html" class="admin-nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <section class="admin-section">
            <div class="admin-welcome">
                <button class="admin-btn" id="backBtn" style="margin-bottom: 1rem; background: #e2e8f0; color: #475569;">
                    <i class="fas fa-arrow-left"></i> Back to Users
                </button>
                <h1>User Details</h1>
                <p>View and manage user information</p>
            </div>

            <div class="admin-content-card">
                <h2>User Information</h2>
                <div id="userDetails" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                    <!-- User details will be loaded here -->
                </div>
            </div>

            <div class="admin-content-card">
                <h2>Change User Password</h2>
                <form class="admin-form" id="changePasswordForm">
                    <div class="admin-form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>
                    <div class="admin-form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    <button type="submit" class="admin-btn admin-btn-primary">
                        <i class="fas fa-key"></i> Change Password
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
    <script src="admin-auth.js"></script>
    <script src="view-user.js"></script>
</body>
</html>
