<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Panel</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-logo">
            <i class="fas fa-cube"></i>
            <h2>Clutch Admin</h2>
        </div>
        <div class="admin-user">
            <span id="adminUserName">Admin</span>
            <button class="admin-logout-btn" id="adminLogoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </header>

    <!-- Horizontal Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <a href="dashboard.html" class="admin-nav-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-link active">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="tasks.html" class="admin-nav-link">
                <i class="fas fa-tasks"></i>
                <span>Tasks</span>
            </a>
            <a href="tutors.html" class="admin-nav-link">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>Tutors</span>
            </a>
            <a href="customer-service.html" class="admin-nav-link">
                <i class="fas fa-headset"></i>
                <span>Customer Service</span>
            </a>
            <a href="admins.html" class="admin-nav-link">
                <i class="fas fa-user-shield"></i>
                <span>Admins</span>
            </a>
            <a href="finance.html" class="admin-nav-link">
                <i class="fas fa-wallet"></i>
                <span>Finance</span>
            </a>
            <a href="settings.html" class="admin-nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <section class="admin-section">
            <div class="admin-welcome">
                <h1>User Management</h1>
                <p>View and manage all registered users</p>
            </div>

            <div class="admin-content-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>All Users</h2>
                    <input type="text" id="userSearch" placeholder="Search users..." style="padding: 0.5rem 1rem; border: 2px solid #e2e8f0; border-radius: 8px; width: 250px;">
                </div>
                
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Number</th>
                                <th>Invitation Code</th>
                                <th>Total Amount</th>
                                <th>Registered Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Balance Management Modal -->
            <div id="balanceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
                <div style="background: white; padding: 2rem; border-radius: 16px; max-width: 500px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
                    <h3 style="margin-top: 0; margin-bottom: 1.5rem;">Manage User Balance</h3>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">User</label>
                        <p id="modalUserName" style="margin: 0; color: #64748b;">-</p>
                        <p id="modalUserEmail" style="margin: 0; color: #64748b; font-size: 0.9rem;">-</p>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Current Balance</label>
                        <p id="modalCurrentBalance" style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #2563eb;">$0.00</p>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label for="balanceAmount" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Amount</label>
                        <input type="number" id="balanceAmount" placeholder="Enter amount" style="width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem;">
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Action</label>
                        <div style="display: flex; gap: 1rem;">
                            <button type="button" id="addBalanceBtn" class="admin-btn admin-btn-primary" style="flex: 1; padding: 0.75rem;">
                                <i class="fas fa-plus"></i> Add
                            </button>
                            <button type="button" id="subtractBalanceBtn" class="admin-btn admin-btn-danger" style="flex: 1; padding: 0.75rem;">
                                <i class="fas fa-minus"></i> Subtract
                            </button>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" id="closeModalBtn" class="admin-btn" style="flex: 1; padding: 0.75rem; background: #e2e8f0; color: #475569;">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
    <script src="admin-auth.js"></script>
    <script src="users.js"></script>
</body>
</html>
