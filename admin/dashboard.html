<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-logo">
            <i class="fas fa-cube"></i>
            <h2>Clutch Admin</h2>
        </div>
        <div class="admin-user">
            <span id="adminUserName">Admin</span>
            <button class="admin-logout-btn" id="adminLogoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </header>

    <!-- Horizontal Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <a href="dashboard.html" class="admin-nav-link active">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-link">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="tasks.html" class="admin-nav-link">
                <i class="fas fa-tasks"></i>
                <span>Tasks</span>
            </a>
            <a href="tutors.html" class="admin-nav-link">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>Tutors</span>
            </a>
            <a href="customer-service.html" class="admin-nav-link">
                <i class="fas fa-headset"></i>
                <span>Customer Service</span>
            </a>
            <a href="admins.html" class="admin-nav-link">
                <i class="fas fa-user-shield"></i>
                <span>Admins</span>
            </a>
            <a href="finance.html" class="admin-nav-link">
                <i class="fas fa-wallet"></i>
                <span>Finance</span>
            </a>
            <a href="settings.html" class="admin-nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <section class="admin-section">
            <div class="admin-welcome">
                <h1>Dashboard Overview</h1>
                <p>Monitor your platform's performance and statistics</p>
            </div>

            <div class="admin-stats">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Users</h3>
                        <p id="totalUsers">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Tutors</h3>
                        <p id="totalTutors">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Tasks</h3>
                        <p id="totalTasks">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Revenue</h3>
                        <p id="totalRevenue">$0.00</p>
                    </div>
                </div>
            </div>

            <div class="admin-content-card">
                <h2>Recent Activity</h2>
                <div id="recentActivity">
                    <p style="color: #64748b;">No recent activity to display.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin.js"></script>
</body>
</html>
