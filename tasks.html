<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Clutch Incorporated</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Content -->
    <main>
        <section class="section">
            <div class="tasks-container">
                <h1>Daily Tasks</h1>
                <p>Complete your daily tasks to earn rewards</p>

                <!-- Task Slider -->
                <div class="task-slider-container">
                    <button class="slider-nav-btn slider-prev" id="sliderPrev">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    
                    <div class="task-slider">
                        <div class="task-slide" id="taskSlide">
                            <!-- Task content will be loaded here -->
                        </div>
                    </div>
                    
                    <button class="slider-nav-btn slider-next" id="sliderNext">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Slider Indicators -->
                <div class="slider-indicators">
                    <span class="indicator" data-slide="0"></span>
                    <span class="indicator" data-slide="1"></span>
                    <span class="indicator" data-slide="2"></span>
                </div>

                <!-- Slide Labels -->
                <div class="slide-labels">
                    <span class="slide-label" id="slideLabel">Past Tasks</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Liquid Navigation at Bottom -->
    <nav class="liquid-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li>
                    <a href="home.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="tasks.html" class="nav-link active">
                        <i class="fas fa-tasks"></i>
                        <span>Tasks</span>
                    </a>
                </li>
                <li>
                    <a href="trade.html" class="nav-link">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Trade</span>
                    </a>
                </li>
                <li>
                    <a href="chat.html" class="nav-link">
                        <i class="fas fa-comments"></i>
                        <span>Chat</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <script src="script.js"></script>
    <script src="auth-check.js"></script>
    <script src="user-tasks.js"></script>
</body>
</html>
