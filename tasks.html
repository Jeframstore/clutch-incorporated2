<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Clutch Incorporated</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Content -->
    <main>
        <section class="section">
            <div class="tasks-container">
                <h1>Daily Tasks</h1>
                <p>Complete your daily tasks to earn rewards</p>

                <!-- Task Sections -->
                <div class="task-sections">
                    <!-- Past Tasks Section -->
                    <div class="task-section past-tasks-section">
                        <h2 class="section-title past-title">
                            <i class="fas fa-history"></i> Past Tasks
                        </h2>
                        <div class="task-section-content" id="pastTasks">
                            <!-- Past tasks will be loaded here -->
                        </div>
                    </div>

                    <!-- Present Task Section -->
                    <div class="task-section present-task-section">
                        <h2 class="section-title present-title">
                            <i class="fas fa-clock"></i> Present Task
                        </h2>
                        <div class="task-section-content" id="presentTask">
                            <!-- Present task will be loaded here -->
                        </div>
                    </div>

                    <!-- Next Task Section -->
                    <div class="task-section next-task-section">
                        <h2 class="section-title next-title">
                            <i class="fas fa-forward"></i> Next Task
                        </h2>
                        <div class="task-section-content" id="nextTask">
                            <!-- Next task will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Liquid Navigation at Bottom -->
    <nav class="liquid-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li>
                    <a href="home.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="tasks.html" class="nav-link active">
                        <i class="fas fa-tasks"></i>
                        <span>Tasks</span>
                    </a>
                </li>
                <li>
                    <a href="trade.html" class="nav-link">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Trade</span>
                    </a>
                </li>
                <li>
                    <a href="chat.html" class="nav-link">
                        <i class="fas fa-comments"></i>
                        <span>Chat</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <script src="script.js"></script>
    <script src="auth-check.js"></script>
    <script src="user-tasks.js"></script>
</body>
</html>
